<?xml version="1.0" encoding="UTF-8"?>
<!--
  empaque-reference.svg — point 5, "El café listo".
  TEMPORARY PLACEHOLDER ARTWORK standing in for a photograph that does not
  exist yet. Original illustration drawn for coffee-origin-explorer.
  The pack label is deliberately left blank: the family's real identity,
  origin and story are not decided yet. It carries a visible "REFERENCIA"
  ribbon so it is never mistaken for a real photograph or a real product
  shot. Replace with a real photo (WebP/AVIF).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="emBackdrop" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f2e6d2" />
      <stop offset="0.55" stop-color="#e0cdae" />
      <stop offset="1" stop-color="#c3ab8b" />
    </linearGradient>
    <linearGradient id="emTable" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#8a6b4c" />
      <stop offset="0.45" stop-color="#6f5238" />
      <stop offset="1" stop-color="#4a3527" />
    </linearGradient>
    <linearGradient id="emBag" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#4a3527" />
      <stop offset="0.3" stop-color="#6f5238" />
      <stop offset="0.72" stop-color="#5a4029" />
      <stop offset="1" stop-color="#2b1e16" />
    </linearGradient>
    <linearGradient id="emLabel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fbf6ee" />
      <stop offset="1" stop-color="#e6d8c2" />
    </linearGradient>
    <linearGradient id="emCup" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#f3ece1" />
      <stop offset="1" stop-color="#d3c6b4" />
    </linearGradient>
    <radialGradient id="emBrew" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#7a4a25" />
      <stop offset="0.6" stop-color="#4a3527" />
      <stop offset="1" stop-color="#2b1e16" />
    </radialGradient>
    <linearGradient id="emBean" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7d5633" />
      <stop offset="0.6" stop-color="#4a3527" />
      <stop offset="1" stop-color="#2b1e16" />
    </linearGradient>
  </defs>

  <!-- warm studio-ish backdrop and a wooden table -->
  <rect width="1200" height="800" fill="url(#emBackdrop)" />
  <circle cx="380" cy="230" r="300" fill="#fbf6ee" opacity="0.4" />
  <path d="M-40 560 L 1240 540 L 1240 840 L -40 840 Z" fill="url(#emTable)" />
  <g stroke="#4a3527" stroke-opacity="0.45" stroke-width="4">
    <path d="M-40 620 L 1240 602" />
    <path d="M-40 690 L 1240 670" />
    <path d="M-40 762 L 1240 742" />
  </g>
  <g stroke="#a98763" stroke-opacity="0.22" stroke-width="3">
    <path d="M-40 604 L 1240 586" />
    <path d="M-40 676 L 1240 656" />
  </g>

  <!-- ============ THE BAG ============ -->
  <g>
    <ellipse cx="470" cy="672" rx="230" ry="34" fill="#2b1e16" opacity="0.35" />
    <!-- gusseted body -->
    <path d="M300 240 L 640 240 L 662 660 C 608 684, 336 684, 282 660 Z" fill="url(#emBag)" />
    <!-- side gusset, lighter so the bag reads as a volume -->
    <path d="M300 240 L 366 240 L 356 672 C 326 670, 300 666, 282 660 Z" fill="#7d5633" opacity="0.5" />
    <path d="M596 240 L 640 240 L 662 660 C 640 670, 616 676, 592 678 Z" fill="#2b1e16" opacity="0.45" />
    <!-- folded and crimped top -->
    <path d="M286 244 L 654 244 L 650 190 C 588 168, 352 168, 292 190 Z" fill="#5a4029" />
    <path d="M292 196 L 648 196 L 646 166 C 586 148, 354 148, 294 166 Z" fill="#4a3527" />
    <g stroke="#2b1e16" stroke-opacity="0.6" stroke-width="5">
      <path d="M300 178 L 302 236" />
      <path d="M360 168 L 360 238" />
      <path d="M420 162 L 420 240" />
      <path d="M480 160 L 480 240" />
      <path d="M540 162 L 540 240" />
      <path d="M600 168 L 598 238" />
    </g>
    <!-- tin tie -->
    <rect x="290" y="150" width="364" height="18" rx="9" fill="#a98763" />
    <rect x="290" y="150" width="364" height="8" rx="4" fill="#c9b18f" />
    <!-- degassing valve -->
    <circle cx="604" cy="330" r="22" fill="#2b1e16" />
    <circle cx="604" cy="330" r="12" fill="#6f5238" />
    <circle cx="604" cy="330" r="4" fill="#2b1e16" />

    <!-- blank label: the family's identity is not decided yet -->
    <rect x="336" y="300" width="230" height="286" rx="10" fill="url(#emLabel)" />
    <rect x="336" y="300" width="230" height="286" rx="10" fill="none" stroke="#b4643a" stroke-width="5" stroke-dasharray="14 10" />
    <!-- a plain mountain-and-cherry mark, no brand -->
    <g transform="translate(451,392)">
      <path d="M-70 40 L -26 -22 L 2 14 L 34 -34 L 70 40 Z" fill="#4c7a45" />
      <path d="M-26 -22 L 2 14 L -12 40 L -46 40 Z" fill="#2f5733" />
      <circle cx="40" cy="-46" r="16" fill="#c0392b" />
      <circle cx="35" cy="-51" r="4.5" fill="#fbf6ee" opacity="0.6" />
    </g>
    <g stroke="#a98763" stroke-width="7" stroke-linecap="round">
      <path d="M382 470 L 520 470" />
      <path d="M382 498 L 486 498" />
    </g>
    <text x="451" y="546" text-anchor="middle" fill="#b4643a" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="bold" letter-spacing="0">ETIQUETA PENDIENTE</text>
    <text x="451" y="572" text-anchor="middle" fill="#6f5238" font-family="Verdana, Geneva, sans-serif" font-size="16">identidad por definir</text>
  </g>

  <!-- ============ THE CUP ============ -->
  <g>
    <ellipse cx="880" cy="666" rx="170" ry="30" fill="#2b1e16" opacity="0.32" />
    <!-- saucer -->
    <ellipse cx="880" cy="640" rx="168" ry="44" fill="#d3c6b4" />
    <ellipse cx="880" cy="632" rx="168" ry="44" fill="url(#emCup)" />
    <ellipse cx="880" cy="630" rx="112" ry="28" fill="#e2d8c9" />
    <!-- handle -->
    <path d="M1000 520 C 1062 506, 1092 542, 1074 578 C 1058 610, 1014 616, 992 598" fill="none" stroke="#e8ded1" stroke-width="26" stroke-linecap="round" />
    <path d="M1000 520 C 1062 506, 1092 542, 1074 578 C 1058 610, 1014 616, 992 598" fill="none" stroke="#fbf6ee" stroke-width="12" stroke-linecap="round" />
    <!-- cup body -->
    <path d="M756 494 L 1004 494 L 976 604 C 960 630, 800 630, 784 604 Z" fill="url(#emCup)" />
    <path d="M756 494 L 1004 494 L 996 526 C 960 544, 800 544, 764 526 Z" fill="#ffffff" opacity="0.5" />
    <ellipse cx="880" cy="494" rx="124" ry="36" fill="#f3ece1" />
    <ellipse cx="880" cy="494" rx="112" ry="30" fill="url(#emBrew)" />
    <!-- crema -->
    <ellipse cx="866" cy="490" rx="74" ry="18" fill="#a9703c" opacity="0.65" />
    <ellipse cx="850" cy="486" rx="34" ry="9" fill="#c9924f" opacity="0.6" />
    <!-- steam -->
    <g stroke="#fbf6ee" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M828 440 C 852 404, 812 376, 838 336 C 856 308, 838 288, 842 268" />
      <path d="M900 448 C 926 410, 886 382, 912 342 C 930 314, 914 296, 918 278" />
      <path d="M964 456 C 984 424, 952 400, 972 368" opacity="0.6" />
    </g>
    <!-- a spoon on the saucer -->
    <g>
      <path d="M978 654 L 1082 630" stroke="#c3b6a4" stroke-width="10" stroke-linecap="round" />
      <ellipse cx="968" cy="656" rx="26" ry="14" transform="rotate(-13 968 656)" fill="#d8cdbd" />
      <ellipse cx="968" cy="654" rx="18" ry="8" transform="rotate(-13 968 654)" fill="#b8ab99" />
    </g>
  </g>

  <!-- roasted beans scattered on the table -->
  <g>
    <g fill="url(#emBean)">
      <ellipse cx="248" cy="700" rx="30" ry="20" transform="rotate(-18 248 700)" />
      <ellipse cx="330" cy="732" rx="31" ry="21" transform="rotate(12 330 732)" />
      <ellipse cx="180" cy="744" rx="29" ry="19" transform="rotate(26 180 744)" />
      <ellipse cx="640" cy="716" rx="30" ry="20" transform="rotate(-8 640 716)" />
      <ellipse cx="716" cy="752" rx="32" ry="21" transform="rotate(18 716 752)" />
      <ellipse cx="1044" cy="712" rx="30" ry="20" transform="rotate(-22 1044 712)" />
      <ellipse cx="1120" cy="748" rx="31" ry="21" transform="rotate(8 1120 748)" />
      <ellipse cx="86" cy="706" rx="28" ry="19" transform="rotate(-6 86 706)" />
      <ellipse cx="560" cy="764" rx="30" ry="20" transform="rotate(-14 560 764)" />
      <ellipse cx="900" cy="736" rx="29" ry="19" transform="rotate(22 900 736)" />
    </g>
    <g stroke="#2b1e16" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M226 692 C 242 702, 256 706, 270 708" />
      <path d="M306 726 C 322 736, 338 740, 354 738" />
      <path d="M158 736 C 172 748, 188 752, 202 752" />
      <path d="M618 710 C 634 720, 650 724, 664 722" />
      <path d="M692 744 C 708 756, 724 760, 740 758" />
      <path d="M1022 706 C 1038 714, 1054 718, 1068 718" />
      <path d="M1098 742 C 1114 752, 1130 756, 1146 754" />
      <path d="M64 700 C 80 710, 96 714, 110 712" />
      <path d="M538 758 C 554 768, 570 772, 584 770" />
      <path d="M878 730 C 894 740, 910 744, 924 742" />
    </g>
    <g fill="#a9703c" opacity="0.45">
      <ellipse cx="240" cy="690" rx="10" ry="5" transform="rotate(-18 240 690)" />
      <ellipse cx="632" cy="706" rx="10" ry="5" transform="rotate(-8 632 706)" />
      <ellipse cx="1036" cy="702" rx="10" ry="5" transform="rotate(-22 1036 702)" />
    </g>
  </g>

  <!-- ============ PROVISIONAL MARKERS ============ -->
  <rect x="10" y="10" width="1180" height="780" fill="none" stroke="#fbf6ee" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="18 14" />
  <g>
    <path d="M916 0 L 1200 284 L 1200 142 L 1058 0 Z" fill="#c0392b" />
    <path d="M916 0 L 1200 284 L 1200 258 L 942 0 Z" fill="#8f2a1f" opacity="0.5" />
    <text x="1098" y="112" transform="rotate(45 1098 112)" text-anchor="middle" fill="#fbf6ee" font-family="Verdana, Geneva, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">REFERENCIA</text>
  </g>
  <g>
    <rect x="34" y="722" width="430" height="46" rx="23" fill="#2b1e16" opacity="0.72" />
    <text x="60" y="752" fill="#fbf6ee" font-family="Verdana, Geneva, sans-serif" font-size="22">Ilustración provisional · no es la finca</text>
  </g>
</svg>
