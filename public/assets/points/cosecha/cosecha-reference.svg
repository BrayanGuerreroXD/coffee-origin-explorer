<?xml version="1.0" encoding="UTF-8"?>
<!--
  cosecha-reference.svg — point 2, "La cosecha".
  TEMPORARY PLACEHOLDER ARTWORK standing in for a photograph that does not
  exist yet. Original illustration drawn for coffee-origin-explorer.
  It carries a visible "REFERENCIA" ribbon so it is never mistaken for a real
  photograph of the family's farm. Replace with a real photo (WebP/AVIF).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="coBg" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7da362" />
      <stop offset="0.45" stop-color="#4c7a45" />
      <stop offset="1" stop-color="#1f3a24" />
    </linearGradient>
    <linearGradient id="coBasket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c9a476" />
      <stop offset="0.55" stop-color="#a98763" />
      <stop offset="1" stop-color="#6f5238" />
    </linearGradient>
    <linearGradient id="coSkin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#c9926a" />
      <stop offset="0.6" stop-color="#a97148" />
      <stop offset="1" stop-color="#7d4e2f" />
    </linearGradient>
    <linearGradient id="coSleeve" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e0cdae" />
      <stop offset="1" stop-color="#b9a489" />
    </linearGradient>
    <radialGradient id="coCherry" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e05a3f" />
      <stop offset="0.6" stop-color="#c0392b" />
      <stop offset="1" stop-color="#8f2a1f" />
    </radialGradient>
    <radialGradient id="coCherryRipe" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f0be62" />
      <stop offset="0.6" stop-color="#e8a33d" />
      <stop offset="1" stop-color="#b4643a" />
    </radialGradient>
    <linearGradient id="coLeaf" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4c7a45" />
      <stop offset="1" stop-color="#1f3a24" />
    </linearGradient>
  </defs>

  <!-- soft out-of-focus plantation behind -->
  <rect width="1200" height="800" fill="url(#coBg)" />
  <g fill="#7da362" opacity="0.28">
    <circle cx="140" cy="140" r="90" />
    <circle cx="330" cy="70" r="110" />
    <circle cx="560" cy="150" r="80" />
    <circle cx="860" cy="90" r="120" />
    <circle cx="1090" cy="180" r="95" />
    <circle cx="60" cy="330" r="85" />
    <circle cx="1150" cy="380" r="100" />
  </g>
  <g fill="#2f5733" opacity="0.4">
    <circle cx="240" cy="250" r="105" />
    <circle cx="700" cy="230" r="120" />
    <circle cx="1000" cy="330" r="95" />
    <circle cx="430" cy="300" r="80" />
  </g>
  <g fill="#c0392b" opacity="0.28">
    <circle cx="200" cy="200" r="13" />
    <circle cx="760" cy="180" r="14" />
    <circle cx="1040" cy="260" r="12" />
    <circle cx="420" cy="220" r="11" />
  </g>

  <!-- a coffee branch arching in from the top left -->
  <g>
    <path d="M-30 90 C 110 130, 250 178, 360 250" stroke="#4a3527" stroke-width="16" stroke-linecap="round" fill="none" />
    <g fill="url(#coLeaf)">
      <ellipse cx="60" cy="126" rx="74" ry="28" transform="rotate(20 60 126)" />
      <ellipse cx="170" cy="172" rx="70" ry="26" transform="rotate(26 170 172)" />
      <ellipse cx="270" cy="222" rx="64" ry="24" transform="rotate(32 270 222)" />
      <ellipse cx="110" cy="66" rx="66" ry="25" transform="rotate(-14 110 66)" />
      <ellipse cx="228" cy="112" rx="62" ry="24" transform="rotate(-8 228 112)" />
    </g>
    <g>
      <circle cx="150" cy="126" r="17" fill="url(#coCherry)" />
      <circle cx="184" cy="140" r="15" fill="url(#coCherry)" />
      <circle cx="120" cy="146" r="14" fill="url(#coCherryRipe)" />
      <circle cx="276" cy="184" r="16" fill="url(#coCherry)" />
      <circle cx="306" cy="198" r="13" fill="#4c7a45" />
      <g fill="#fbf6ee" opacity="0.55">
        <circle cx="145" cy="120" r="4.5" />
        <circle cx="271" cy="178" r="4" />
      </g>
    </g>
  </g>

  <!-- ============ THE BASKET ============ -->
  <g>
    <ellipse cx="600" cy="740" rx="300" ry="42" fill="#1f3a24" opacity="0.45" />
    <!-- body -->
    <path d="M338 486 C 338 446, 862 446, 862 486 L 812 706 C 806 744, 394 744, 388 706 Z" fill="url(#coBasket)" />
    <!-- weave -->
    <g stroke="#6f5238" stroke-opacity="0.55" stroke-width="7" fill="none">
      <path d="M352 552 C 480 572, 720 572, 848 552" />
      <path d="M362 616 C 486 636, 714 636, 838 616" />
      <path d="M374 678 C 492 698, 708 698, 828 678" />
    </g>
    <g stroke="#c9a476" stroke-opacity="0.5" stroke-width="4" fill="none">
      <path d="M352 540 C 480 560, 720 560, 848 540" />
      <path d="M362 604 C 486 624, 714 624, 838 604" />
    </g>
    <g stroke="#6f5238" stroke-opacity="0.35" stroke-width="5">
      <path d="M420 480 L 432 728" />
      <path d="M510 476 L 516 736" />
      <path d="M600 474 L 600 740" />
      <path d="M690 476 L 684 736" />
      <path d="M780 480 L 768 728" />
    </g>
    <!-- rim -->
    <ellipse cx="600" cy="486" rx="262" ry="56" fill="#8a6b4c" />
    <ellipse cx="600" cy="480" rx="262" ry="56" fill="#c9a476" />
    <ellipse cx="600" cy="486" rx="232" ry="44" fill="#4a3527" />

    <!-- heaped cherries -->
    <path d="M372 480 C 400 412, 500 372, 600 372 C 700 372, 800 412, 828 480 C 760 512, 440 512, 372 480 Z" fill="#8f2a1f" />
    <g>
      <circle cx="600" cy="404" r="30" fill="url(#coCherry)" />
      <circle cx="530" cy="418" r="29" fill="url(#coCherry)" />
      <circle cx="670" cy="416" r="29" fill="url(#coCherry)" />
      <circle cx="462" cy="446" r="28" fill="url(#coCherry)" />
      <circle cx="738" cy="444" r="28" fill="url(#coCherry)" />
      <circle cx="566" cy="452" r="30" fill="url(#coCherryRipe)" />
      <circle cx="636" cy="450" r="28" fill="url(#coCherry)" />
      <circle cx="404" cy="472" r="27" fill="url(#coCherry)" />
      <circle cx="796" cy="470" r="27" fill="url(#coCherryRipe)" />
      <circle cx="498" cy="484" r="28" fill="url(#coCherry)" />
      <circle cx="600" cy="490" r="29" fill="url(#coCherry)" />
      <circle cx="702" cy="484" r="28" fill="url(#coCherry)" />
      <circle cx="444" cy="502" r="24" fill="#8f2a1f" />
      <circle cx="756" cy="500" r="24" fill="#8f2a1f" />
      <circle cx="546" cy="506" r="22" fill="#8f2a1f" />
      <circle cx="656" cy="508" r="22" fill="#8f2a1f" />
      <!-- a few unripe ones, as a picker would leave -->
      <circle cx="486" cy="400" r="20" fill="#4c7a45" />
      <circle cx="712" cy="392" r="18" fill="#7da362" />
      <g fill="#fbf6ee" opacity="0.55">
        <circle cx="591" cy="394" r="8" />
        <circle cx="521" cy="408" r="7" />
        <circle cx="661" cy="406" r="7" />
        <circle cx="557" cy="442" r="7" />
        <circle cx="787" cy="460" r="6" />
        <circle cx="453" cy="436" r="6" />
      </g>
    </g>
  </g>

  <!-- ============ HANDS GRIPPING THE RIM ============ -->
  <!-- left hand -->
  <g>
    <path d="M-30 800 C 70 754, 170 700, 268 646 L 330 726 C 232 782, 134 838, 40 892 L -30 892 Z" fill="url(#coSkin)" />
    <path d="M-30 828 C 34 800, 96 768, 156 734 L 206 802 C 146 836, 84 870, 22 902 L -30 902 Z" fill="url(#coSleeve)" />
    <path d="M150 730 L 212 798 L 236 782 L 176 716 Z" fill="#c9b69a" />
    <!-- palm -->
    <path d="M286 656 C 268 610, 292 566, 340 552 C 392 536, 444 556, 458 598 C 472 640, 448 686, 400 700 C 350 714, 302 698, 286 656 Z" fill="url(#coSkin)" />
    <!-- fingers hooked over the rim -->
    <g fill="url(#coSkin)" stroke="#7d4e2f" stroke-opacity="0.4" stroke-width="3">
      <rect x="310" y="486" width="30" height="92" rx="15" transform="rotate(-12 325 532)" />
      <rect x="348" y="474" width="31" height="100" rx="15.5" transform="rotate(-5 363 524)" />
      <rect x="387" y="480" width="30" height="96" rx="15" transform="rotate(4 402 528)" />
      <rect x="425" y="498" width="28" height="86" rx="14" transform="rotate(12 439 541)" />
    </g>
    <!-- thumb -->
    <rect x="272" y="638" width="104" height="30" rx="15" transform="rotate(14 324 653)" fill="url(#coSkin)" stroke="#7d4e2f" stroke-opacity="0.4" stroke-width="3" />
    <g fill="#7d4e2f" opacity="0.2">
      <ellipse cx="330" cy="568" rx="15" ry="8" />
      <ellipse cx="366" cy="560" rx="15" ry="8" />
      <ellipse cx="404" cy="564" rx="15" ry="8" />
      <ellipse cx="440" cy="578" rx="13" ry="7" />
    </g>
  </g>

  <!-- right hand -->
  <g>
    <path d="M1230 780 C 1130 736, 1030 686, 934 636 L 874 716 C 972 770, 1070 824, 1164 876 L 1230 876 Z" fill="url(#coSkin)" />
    <path d="M1230 808 C 1166 782, 1104 752, 1044 720 L 996 788 C 1056 822, 1118 854, 1180 886 L 1230 886 Z" fill="url(#coSleeve)" />
    <path d="M1050 716 L 990 784 L 966 768 L 1026 702 Z" fill="#c9b69a" />
    <path d="M916 646 C 934 600, 910 556, 862 542 C 810 526, 758 546, 744 588 C 730 630, 754 676, 802 690 C 852 704, 900 688, 916 646 Z" fill="url(#coSkin)" />
    <g fill="url(#coSkin)" stroke="#7d4e2f" stroke-opacity="0.4" stroke-width="3">
      <rect x="862" y="476" width="30" height="92" rx="15" transform="rotate(12 877 522)" />
      <rect x="823" y="464" width="31" height="100" rx="15.5" transform="rotate(5 838 514)" />
      <rect x="785" y="470" width="30" height="96" rx="15" transform="rotate(-4 800 518)" />
      <rect x="749" y="488" width="28" height="86" rx="14" transform="rotate(-12 763 531)" />
    </g>
    <rect x="826" y="628" width="104" height="30" rx="15" transform="rotate(-14 878 643)" fill="url(#coSkin)" stroke="#7d4e2f" stroke-opacity="0.4" stroke-width="3" />
    <g fill="#7d4e2f" opacity="0.2">
      <ellipse cx="872" cy="558" rx="15" ry="8" />
      <ellipse cx="836" cy="550" rx="15" ry="8" />
      <ellipse cx="798" cy="554" rx="15" ry="8" />
      <ellipse cx="762" cy="568" rx="13" ry="7" />
    </g>
  </g>

  <!-- ============ PROVISIONAL MARKERS ============ -->
  <rect x="10" y="10" width="1180" height="780" fill="none" stroke="#fbf6ee" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="18 14" />
  <g>
    <path d="M916 0 L 1200 284 L 1200 142 L 1058 0 Z" fill="#c0392b" />
    <path d="M916 0 L 1200 284 L 1200 258 L 942 0 Z" fill="#8f2a1f" opacity="0.5" />
    <text x="1098" y="112" transform="rotate(45 1098 112)" text-anchor="middle" fill="#fbf6ee" font-family="Verdana, Geneva, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">REFERENCIA</text>
  </g>
  <g>
    <rect x="34" y="722" width="430" height="46" rx="23" fill="#2b1e16" opacity="0.72" />
    <text x="60" y="752" fill="#fbf6ee" font-family="Verdana, Geneva, sans-serif" font-size="22">Ilustración provisional · no es la finca</text>
  </g>
</svg>
