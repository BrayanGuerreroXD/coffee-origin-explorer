<?xml version="1.0" encoding="UTF-8"?>
<!--
  paths-reference.svg
  TEMPORARY PLACEHOLDER ARTWORK. Original illustration drawn for
  coffee-origin-explorer while the real photographs of the farm do not exist.
  Replace with real farm artwork or photography.

  Layer: PathsLayer (parallax 0.75). TRANSPARENT background on purpose.
  Winding tracks that tie the farm together: the main track climbs from the
  bottom right past the house to the beneficiadero, a branch drops to the
  drying deck, and two narrow footpaths continue up into the high lots.
  Tracks are wide and warm near the viewer and thin and pale uphill.
  Every track runs off the edge of the viewBox.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="phSurface" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#c9b18f" />
      <stop offset="0.45" stop-color="#a98763" />
      <stop offset="1" stop-color="#9b8268" />
    </linearGradient>
  </defs>

  <!-- ==================== MAIN TRACK ====================
       bottom right -> farmhouse -> beneficiadero, drawn as a filled
       ribbon so it can taper with distance -->
  <g>
    <!-- cast shadow along the downhill lip -->
    <path
      d="M2040 1080 C 1820 1032, 1640 962, 1480 906
         C 1320 850, 1200 828, 1090 812
         C 980 796, 900 754, 820 706
         C 760 670, 700 652, 620 648
         L 618 690 C 706 696, 770 716, 832 754
         C 914 804, 994 840, 1104 856
         C 1214 872, 1336 894, 1498 950
         C 1660 1006, 1846 1076, 2046 1128 Z"
      fill="#2b1e16"
      opacity="0.28"
      transform="translate(0,14)"
    />
    <path
      d="M2040 1080 C 1820 1032, 1640 962, 1480 906
         C 1320 850, 1200 828, 1090 812
         C 980 796, 900 754, 820 706
         C 760 670, 700 652, 620 648
         L 618 690 C 706 696, 770 716, 832 754
         C 914 804, 994 840, 1104 856
         C 1214 872, 1336 894, 1498 950
         C 1660 1006, 1846 1076, 2046 1128 Z"
      fill="url(#phSurface)"
    />
    <!-- wheel ruts -->
    <g stroke="#8a6b4c" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M2030 1094 C 1810 1046, 1632 978, 1474 922 C 1316 866, 1198 844, 1088 828 C 980 812, 900 770, 822 722 C 764 686, 706 668, 628 664" />
      <path d="M2036 1116 C 1814 1068, 1636 1000, 1478 944 C 1320 888, 1202 866, 1092 850 C 984 834, 904 792, 826 744 C 768 708, 710 690, 630 686" />
    </g>
    <!-- pale gravel highlight down the crown -->
    <path
      d="M2034 1102 C 1812 1054, 1634 986, 1476 930 C 1318 874, 1200 852, 1090 836 C 982 820, 902 778, 824 730 C 766 694, 708 676, 629 672"
      stroke="#e0cdae"
      stroke-opacity="0.55"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- ==================== BRANCH TO THE DRYING DECK ==================== -->
  <g>
    <path
      d="M662 664 C 624 706, 592 748, 566 792
         C 540 836, 512 866, 470 886
         C 424 908, 360 920, 286 924
         L 292 956 C 374 952, 448 938, 500 912
         C 552 886, 584 852, 612 806
         C 640 760, 672 716, 706 676 Z"
      fill="#2b1e16"
      opacity="0.26"
      transform="translate(0,12)"
    />
    <path
      d="M662 664 C 624 706, 592 748, 566 792
         C 540 836, 512 866, 470 886
         C 424 908, 360 920, 286 924
         L 292 956 C 374 952, 448 938, 500 912
         C 552 886, 584 852, 612 806
         C 640 760, 672 716, 706 676 Z"
      fill="url(#phSurface)"
    />
    <path
      d="M684 670 C 646 712, 614 754, 588 798 C 562 842, 534 874, 490 896 C 444 918, 376 932, 290 938"
      stroke="#e0cdae"
      stroke-opacity="0.5"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />
    <!-- track continues off the left edge -->
    <path
      d="M292 924 C 200 930, 80 942, -60 968 C -180 990, -300 1016, -420 1046
         L -410 1086 C -286 1054, -160 1028, -40 1006 C 84 984, 200 968, 296 960 Z"
      fill="url(#phSurface)"
      opacity="0.92"
    />
  </g>

  <!-- ==================== FOOTPATH UP THE RIGHT-HAND LOTS ==================== -->
  <g>
    <path
      d="M866 700 C 940 654, 1030 616, 1130 588
         C 1240 558, 1350 532, 1450 500
         C 1560 466, 1680 436, 1820 414
         L 1826 436 C 1692 458, 1576 488, 1468 522
         C 1368 554, 1258 580, 1148 610
         C 1048 638, 958 676, 884 722 Z"
      fill="#b09a7c"
      opacity="0.85"
    />
    <path
      d="M874 710 C 948 664, 1038 626, 1138 598 C 1248 568, 1358 542, 1458 510 C 1566 476, 1686 446, 1824 424"
      stroke="#e0cdae"
      stroke-opacity="0.45"
      stroke-width="4"
      stroke-linecap="round"
      fill="none"
    />
    <!-- last thin stretch climbing into the distance, cooler and fainter -->
    <path
      d="M1450 500 C 1520 468, 1580 430, 1624 386 C 1668 342, 1700 300, 1726 258"
      stroke="#b8b7a2"
      stroke-opacity="0.55"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M1240 556 C 1300 512, 1348 460, 1382 404 C 1408 360, 1424 318, 1434 276"
      stroke="#b8b7a2"
      stroke-opacity="0.4"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- ==================== FOOTPATH UP THE LEFT-HAND LOTS ==================== -->
  <g>
    <path
      d="M560 792 C 490 756, 420 726, 340 704
         C 250 680, 150 662, 40 650
         C -90 636, -240 628, -420 626
         L -420 650 C -244 652, -96 660, 32 674
         C 142 686, 240 704, 328 728
         C 406 750, 476 780, 546 816 Z"
      fill="#b09a7c"
      opacity="0.8"
    />
    <path
      d="M340 704 C 306 660, 288 610, 282 558 C 276 508, 280 456, 292 404"
      stroke="#b8b7a2"
      stroke-opacity="0.5"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M292 404 C 300 364, 318 330, 344 300"
      stroke="#b8b7a2"
      stroke-opacity="0.35"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- ==================== SMALL TRACKSIDE DETAIL ==================== -->
  <g>
    <!-- stepping stones where the branch crosses the fold -->
    <g fill="#a98763" opacity="0.75">
      <ellipse cx="596" cy="778" rx="13" ry="6" />
      <ellipse cx="572" cy="806" rx="12" ry="5" />
      <ellipse cx="548" cy="834" rx="13" ry="6" />
    </g>
    <!-- roadside stones -->
    <g fill="#8a6b4c" opacity="0.6">
      <ellipse cx="1290" cy="880" rx="18" ry="8" />
      <ellipse cx="1560" cy="948" rx="22" ry="9" />
      <ellipse cx="946" cy="792" rx="14" ry="6" />
      <ellipse cx="400" cy="944" rx="16" ry="7" />
      <ellipse cx="120" cy="962" rx="19" ry="8" />
    </g>
    <!-- a simple wooden gate where the main track leaves the frame -->
    <g stroke="#6f5238" stroke-width="7" stroke-linecap="round">
      <path d="M1504 884 L 1500 944" />
      <path d="M1604 916 L 1600 976" />
    </g>
    <g stroke="#8a6b4c" stroke-width="5" stroke-linecap="round">
      <path d="M1502 900 L 1602 932" />
      <path d="M1501 924 L 1601 956" />
    </g>
  </g>
</svg>
