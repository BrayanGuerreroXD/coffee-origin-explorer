<?xml version="1.0" encoding="UTF-8"?>
<!--
  foreground-reference.svg
  TEMPORARY PLACEHOLDER ARTWORK. Original illustration drawn for
  coffee-origin-explorer while the real photographs of the farm do not exist.
  Replace with real farm artwork or photography.

  Layer: ForegroundEffects (parallax 1.00). TRANSPARENT background on purpose.
  Near foliage that frames the bottom and both sides: the darkest, warmest,
  most saturated greens in the scene, which is what makes the layers behind
  read as distant. Deliberate gaps are left around the two low markers at
  (0.16, 0.11) and (0.82, 0.10) and around the two high ones. Everything
  overscans the viewBox, the bottom band most of all.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="fgLeafA" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2f5733" />
      <stop offset="0.6" stop-color="#1f3a24" />
      <stop offset="1" stop-color="#16291a" />
    </linearGradient>
    <linearGradient id="fgLeafB" x1="0.2" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#4c7a45" />
      <stop offset="0.7" stop-color="#2f5733" />
      <stop offset="1" stop-color="#1f3a24" />
    </linearGradient>
    <linearGradient id="fgBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a24" stop-opacity="0" />
      <stop offset="0.45" stop-color="#1f3a24" stop-opacity="0.85" />
      <stop offset="1" stop-color="#16291a" />
    </linearGradient>
    <linearGradient id="fgVignetteL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b1e16" stop-opacity="0.45" />
      <stop offset="1" stop-color="#2b1e16" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fgVignetteR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2b1e16" stop-opacity="0.45" />
      <stop offset="1" stop-color="#2b1e16" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ==================================================================
       SOFT EDGE VIGNETTES — pull the eye to the readable centre band
       ================================================================== -->
  <rect x="-400" y="-200" width="620" height="1500" fill="url(#fgVignetteL)" />
  <rect x="1380" y="-200" width="620" height="1500" fill="url(#fgVignetteR)" />

  <!-- ==================================================================
       BOTTOM BAND — dips low where the two near markers land
       ================================================================== -->
  <path
    d="M-400 1300 L -400 946
       C -300 918, -200 900, -110 896
       C -60 894, -20 918, 60 946
       C 110 964, 140 984, 160 1002
       L 380 1002
       C 404 980, 440 958, 500 936
       C 580 906, 660 886, 740 880
       C 840 872, 940 890, 1030 916
       C 1100 936, 1150 966, 1190 1000
       L 1430 1000
       C 1466 966, 1520 936, 1580 918
       C 1680 888, 1800 884, 2000 900
       L 2000 1300 Z"
    fill="url(#fgBand)"
  />
  <rect x="-400" y="1000" width="2400" height="320" fill="#16291a" />

  <!-- scalloped leaf tips along the top of the band -->
  <g fill="#1f3a24">
    <path d="M500 940 q 26 -34 52 0 q 26 -32 52 0 q 26 -30 52 0 q 26 -32 52 0 q 26 -28 52 0 l 0 70 l -260 0 Z" />
    <path d="M820 890 q 24 -32 48 0 q 24 -30 48 0 q 24 -28 48 0 q 24 -30 48 0 l 0 70 l -192 0 Z" />
    <path d="M1500 932 q 26 -34 52 0 q 26 -32 52 0 q 26 -30 52 0 q 26 -32 52 0 l 0 70 l -208 0 Z" />
    <path d="M-380 950 q 26 -34 52 0 q 26 -32 52 0 q 26 -30 52 0 l 0 70 l -156 0 Z" />
  </g>

  <!-- ==================================================================
       LEFT-HAND FROND CLUSTER — kept inside x < 140, clear of (256, 890)
       ================================================================== -->
  <g transform="translate(-30,1040)">
    <path d="M0 0 C -54 -96, -46 -216, 20 -300 C 62 -206, 48 -88, 0 0 Z" fill="url(#fgLeafA)" />
    <path d="M0 0 C 34 -104, 116 -180, 210 -196 C 148 -114, 72 -44, 0 0 Z" fill="url(#fgLeafB)" />
    <path d="M0 0 C -30 -110, -110 -194, -206 -216 C -142 -128, -70 -46, 0 0 Z" fill="url(#fgLeafA)" />
    <path d="M0 0 C 62 -74, 168 -108, 264 -92 C 186 -34, 88 6, 0 0 Z" fill="url(#fgLeafA)" />
    <path d="M0 0 C 14 -128, 82 -238, 178 -292 C 146 -184, 78 -78, 0 0 Z" fill="url(#fgLeafB)" opacity="0.92" />
    <g stroke="#4c7a45" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 0 C 30 -90, 66 -160, 104 -200" />
      <path d="M0 0 C -16 -100, -18 -190, 8 -260" />
      <path d="M0 0 C 46 -50, 110 -76, 168 -84" />
    </g>
  </g>

  <!-- tall stem rising along the very left margin -->
  <g transform="translate(-140,1080)">
    <path d="M0 0 C -6 -180, 10 -360, 60 -520" stroke="#2b1e16" stroke-width="13" stroke-linecap="round" fill="none" />
    <g fill="url(#fgLeafA)">
      <ellipse cx="18" cy="-244" rx="74" ry="26" transform="rotate(-24 18 -244)" />
      <ellipse cx="-22" cy="-320" rx="66" ry="23" transform="rotate(18 -22 -320)" />
      <ellipse cx="42" cy="-402" rx="70" ry="24" transform="rotate(-32 42 -402)" />
      <ellipse cx="6" cy="-478" rx="58" ry="20" transform="rotate(14 6 -478)" />
    </g>
  </g>

  <!-- ==================================================================
       RIGHT-HAND FROND CLUSTER — kept inside x > 1470, clear of (1312, 900)
       ================================================================== -->
  <g transform="translate(1660,1060)">
    <path d="M0 0 C 52 -100, 44 -222, -22 -306 C -64 -210, -50 -90, 0 0 Z" fill="url(#fgLeafA)" />
    <path d="M0 0 C -36 -108, -122 -186, -220 -202 C -154 -118, -74 -46, 0 0 Z" fill="url(#fgLeafB)" />
    <path d="M0 0 C 32 -112, 114 -198, 212 -220 C 146 -132, 72 -48, 0 0 Z" fill="url(#fgLeafA)" />
    <path d="M0 0 C -64 -76, -174 -112, -272 -96 C -192 -36, -90 6, 0 0 Z" fill="url(#fgLeafA)" />
    <path d="M0 0 C -14 -132, -86 -244, -184 -300 C -150 -190, -80 -80, 0 0 Z" fill="url(#fgLeafB)" opacity="0.92" />
    <g stroke="#4c7a45" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 0 C -32 -92, -70 -164, -108 -204" />
      <path d="M0 0 C 16 -102, 18 -194, -10 -266" />
      <path d="M0 0 C -48 -52, -114 -78, -174 -86" />
    </g>
  </g>

  <!-- ==================================================================
       NEAR COFFEE BRANCH, lower centre — the closest thing in the scene
       ================================================================== -->
  <g transform="translate(860,1010)">
    <path d="M-300 30 C -160 -26, 0 -56, 170 -52 C 300 -48, 410 -26, 510 10" stroke="#2b1e16" stroke-width="14" stroke-linecap="round" fill="none" />
    <g fill="url(#fgLeafB)">
      <ellipse cx="-230" cy="-6" rx="60" ry="22" transform="rotate(-18 -230 -6)" />
      <ellipse cx="-140" cy="-46" rx="58" ry="21" transform="rotate(-12 -140 -46)" />
      <ellipse cx="-40" cy="-74" rx="62" ry="22" transform="rotate(-6 -40 -74)" />
      <ellipse cx="70" cy="-82" rx="60" ry="21" transform="rotate(4 70 -82)" />
      <ellipse cx="180" cy="-72" rx="58" ry="21" transform="rotate(10 180 -72)" />
      <ellipse cx="290" cy="-50" rx="56" ry="20" transform="rotate(16 290 -50)" />
      <ellipse cx="400" cy="-18" rx="54" ry="19" transform="rotate(22 400 -18)" />
    </g>
    <g fill="url(#fgLeafA)">
      <ellipse cx="-190" cy="36" rx="56" ry="20" transform="rotate(14 -190 36)" />
      <ellipse cx="-80" cy="10" rx="58" ry="20" transform="rotate(8 -80 10)" />
      <ellipse cx="30" cy="-4" rx="60" ry="21" transform="rotate(2 30 -4)" />
      <ellipse cx="140" cy="0" rx="58" ry="20" transform="rotate(-6 140 0)" />
      <ellipse cx="250" cy="16" rx="56" ry="20" transform="rotate(-12 250 16)" />
    </g>
    <g stroke="#4c7a45" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M-282 -4 L -178 -8" />
      <path d="M-92 -50 L 12 -76" />
      <path d="M126 -84 L 232 -70" />
    </g>
    <!-- a small cluster of cherries, the only strong accent down here -->
    <g>
      <circle cx="-108" cy="-22" r="10" fill="#c0392b" />
      <circle cx="-88" cy="-12" r="9" fill="#e05a3f" />
      <circle cx="-124" cy="-6" r="8" fill="#e8a33d" />
      <circle cx="220" cy="-34" r="9" fill="#c0392b" />
      <circle cx="240" cy="-24" r="8" fill="#e05a3f" />
      <circle cx="-111" cy="-26" r="3" fill="#fbf6ee" opacity="0.5" />
      <circle cx="217" cy="-38" r="2.5" fill="#fbf6ee" opacity="0.5" />
    </g>
  </g>

  <!-- ==================================================================
       HANGING BRANCHES FROM THE TOP EDGE
       Left branch stops before x = 260, right branch starts after x = 1500,
       so neither crowds the high markers at (400, 280) and (1328, 190).
       ================================================================== -->
  <g transform="translate(-40,-60)">
    <path d="M0 0 C 70 70, 150 132, 250 176" stroke="#2b1e16" stroke-width="12" stroke-linecap="round" fill="none" />
    <g fill="url(#fgLeafA)">
      <ellipse cx="46" cy="52" rx="56" ry="20" transform="rotate(42 46 52)" />
      <ellipse cx="106" cy="102" rx="54" ry="19" transform="rotate(34 106 102)" />
      <ellipse cx="170" cy="140" rx="52" ry="18" transform="rotate(26 170 140)" />
      <ellipse cx="226" cy="170" rx="46" ry="16" transform="rotate(20 226 170)" />
      <ellipse cx="20" cy="112" rx="50" ry="18" transform="rotate(66 20 112)" />
      <ellipse cx="82" cy="164" rx="46" ry="16" transform="rotate(58 82 164)" />
    </g>
    <circle cx="150" cy="176" r="8" fill="#c0392b" />
    <circle cx="168" cy="188" r="7" fill="#e8a33d" />
  </g>

  <g transform="translate(1660,-70)">
    <path d="M0 0 C -72 76, -128 148, -164 214" stroke="#2b1e16" stroke-width="12" stroke-linecap="round" fill="none" />
    <g fill="url(#fgLeafA)">
      <ellipse cx="-42" cy="54" rx="56" ry="20" transform="rotate(-42 -42 54)" />
      <ellipse cx="-92" cy="112" rx="54" ry="19" transform="rotate(-52 -92 112)" />
      <ellipse cx="-132" cy="172" rx="50" ry="18" transform="rotate(-60 -132 172)" />
      <ellipse cx="-160" cy="228" rx="44" ry="16" transform="rotate(-70 -160 228)" />
      <ellipse cx="16" cy="96" rx="52" ry="18" transform="rotate(-18 16 96)" />
      <ellipse cx="-16" cy="164" rx="46" ry="16" transform="rotate(-30 -16 164)" />
    </g>
    <circle cx="-118" cy="204" r="8" fill="#c0392b" />
    <circle cx="-136" cy="218" r="7" fill="#e05a3f" />
  </g>

  <!-- ==================================================================
       A FEW OUT-OF-FOCUS MOTES, warm and very light
       ================================================================== -->
  <g fill="#f2e6d2" opacity="0.2">
    <circle cx="300" cy="620" r="16" />
    <circle cx="1180" cy="520" r="12" />
    <circle cx="700" cy="760" r="20" />
    <circle cx="1500" cy="700" r="14" />
    <circle cx="80" cy="500" r="11" />
    <circle cx="960" cy="640" r="9" />
  </g>
</svg>
