<?xml version="1.0" encoding="UTF-8"?>
<!--
  vegetation-reference.svg
  TEMPORARY PLACEHOLDER ARTWORK. Original illustration drawn for
  coffee-origin-explorer while the real photographs of the farm do not exist.
  Replace with real farm artwork or photography.

  Layer: VegetationLayer (parallax 0.50). TRANSPARENT background on purpose.
  Coffee planted in contour rows, scattered shrubs and shade trees (guamos).
  Rows are drawn as dashed round strokes so each dash reads as one bush.
  Distant rows are pale and low contrast; near rows are dark and saturated.
  Open, low-detail pockets are left where the five interest markers land.
  Content overscans the viewBox on every side.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="vgCanopy" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#7da362" />
      <stop offset="0.55" stop-color="#4c7a45" />
      <stop offset="1" stop-color="#2f5733" />
    </linearGradient>
    <linearGradient id="vgCanopyNear" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#5f8c4f" />
      <stop offset="0.5" stop-color="#2f5733" />
      <stop offset="1" stop-color="#1f3a24" />
    </linearGradient>
    <linearGradient id="vgTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f5238" />
      <stop offset="0.55" stop-color="#4a3527" />
      <stop offset="1" stop-color="#2b1e16" />
    </linearGradient>
  </defs>

  <!-- ==================================================================
       FAR PLANTED SLOPES — barely there, cool and pale.
       Kept clear of the markers at (1328,190) and (400,280): rows sit
       below and to the sides of those spots.
       ================================================================== -->
  <g opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M1140 262 C 1250 232, 1400 226, 1560 248" stroke="#7fa08a" stroke-width="9" stroke-dasharray="2 13" />
    <path d="M1160 292 C 1280 260, 1430 254, 1600 276" stroke="#7fa08a" stroke-width="9" stroke-dasharray="2 13" />
    <path d="M1190 322 C 1310 292, 1460 286, 1640 306" stroke="#6f9280" stroke-width="10" stroke-dasharray="2 13" />
    <path d="M240 336 C 350 306, 490 302, 620 322" stroke="#7fa08a" stroke-width="9" stroke-dasharray="2 13" />
    <path d="M220 366 C 340 334, 490 330, 640 352" stroke="#7fa08a" stroke-width="9" stroke-dasharray="2 13" />
    <path d="M196 398 C 320 366, 480 362, 650 384" stroke="#6f9280" stroke-width="10" stroke-dasharray="2 13" />
    <path d="M-340 380 C -200 352, -40 348, 96 368" stroke="#7fa08a" stroke-width="9" stroke-dasharray="2 13" />
    <path d="M760 348 C 880 318, 1010 316, 1120 334" stroke="#7fa08a" stroke-width="9" stroke-dasharray="2 13" />
  </g>

