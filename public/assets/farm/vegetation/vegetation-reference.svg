      <path d="M1160 616 C 1330 574, 1530 574, 1740 610" stroke-width="7" stroke-dasharray="2 20" />
      <path d="M990 700 C 1160 656, 1370 654, 1600 690" stroke-width="7" stroke-dasharray="2 21" />
      <path d="M-420 796 C -120 736, 220 714, 520 750" stroke-width="8" stroke-dasharray="2 23" />
    </g>
  </g>

