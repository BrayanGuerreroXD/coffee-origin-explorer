      <path d="M707 400 C 660 398, 636 372, 656 348 C 646 322, 672 304, 700 312 C 722 292, 760 300, 766 326 C 796 332, 802 366, 776 382 C 762 402, 728 406, 707 400 Z" fill="#9dbaa3" />
