<?xml version="1.0" encoding="UTF-8"?>
<!--
  farm-background-reference.svg
  TEMPORARY PLACEHOLDER ARTWORK. Original illustration drawn for
  coffee-origin-explorer while the real photographs of the farm do not exist.
  Replace with real farm artwork or photography.

  Layer: BackgroundLayer (parallax 0.10). This is the ONLY opaque layer.
  Palette mirrors src/styles/tokens.css. Content overscans the viewBox on
  every side so parallax displacement never exposes an empty border.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#b6d4da" />
      <stop offset="0.18" stop-color="#cfe3e6" />
      <stop offset="0.42" stop-color="#dfe6e0" />
      <stop offset="0.66" stop-color="#ecE6d9" />
      <stop offset="1" stop-color="#f2e6d2" />
    </linearGradient>

    <radialGradient id="bgSunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7edd6" stop-opacity="0.92" />
      <stop offset="0.28" stop-color="#f2e6d2" stop-opacity="0.58" />
      <stop offset="0.62" stop-color="#f2e6d2" stop-opacity="0.2" />
      <stop offset="1" stop-color="#f2e6d2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bgSunDisc" cx="0.42" cy="0.38" r="0.68">
      <stop offset="0" stop-color="#fbf6ee" />
      <stop offset="0.6" stop-color="#f6e8cd" />
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0.45" />
    </radialGradient>

    <linearGradient id="bgHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e6d2" stop-opacity="0" />
      <stop offset="0.55" stop-color="#f2e6d2" stop-opacity="0.65" />
      <stop offset="1" stop-color="#f2e6d2" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="bgFloorWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e6d2" />
      <stop offset="0.5" stop-color="#e3d3b8" />
      <stop offset="1" stop-color="#c9b193" />
    </linearGradient>
  </defs>

  <!-- Opaque sky, heavily overscanned -->
  <rect x="-400" y="-400" width="2400" height="1800" fill="url(#bgSky)" />

  <!-- Warm floor wash so any parallax slip at the bottom stays in palette -->
  <rect x="-400" y="620" width="2400" height="780" fill="url(#bgFloorWarm)" opacity="0.75" />

  <!-- Sun: upper right of centre, clear of the marker at (1328, 190) -->
  <circle cx="1024" cy="150" r="340" fill="url(#bgSunGlow)" />
  <circle cx="1024" cy="150" r="176" fill="#f5ecd8" opacity="0.45" />
  <circle cx="1024" cy="150" r="58" fill="url(#bgSunDisc)" />
  <circle cx="1024" cy="150" r="58" fill="none" stroke="#e8a33d" stroke-opacity="0.25" stroke-width="3" />

  <!-- Soft high cloud bands, low contrast, brushed horizontally -->
  <g fill="#fbf6ee" opacity="0.5">
    <path d="M-360 96 C -120 52, 160 60, 372 92 C 560 120, 712 108, 848 82 C 700 150, 470 176, 246 164 C 60 154, -170 138, -360 122 Z" />
    <path d="M1180 236 C 1352 200, 1548 204, 1760 234 C 1920 256, 1990 282, 1990 300 C 1780 292, 1544 300, 1338 288 C 1232 282, 1180 264, 1180 236 Z" />
    <path d="M-330 318 C -90 288, 190 296, 396 322 C 520 338, 596 350, 640 362 C 420 372, 160 366, -80 352 C -210 344, -300 334, -330 318 Z" opacity="0.7" />
  </g>

  <g fill="#cfe3e6" opacity="0.42">
    <path d="M520 168 C 660 140, 830 146, 950 170 C 820 196, 640 200, 520 186 Z" />
    <path d="M1290 96 C 1418 74, 1580 78, 1700 100 C 1580 124, 1400 126, 1290 112 Z" />
    <path d="M-280 224 C -150 202, 40 206, 150 228 C 20 250, -160 250, -280 238 Z" />
  </g>

  <!-- Distant atmospheric haze sitting where the mountain bases will meet the farm -->
  <rect x="-400" y="300" width="2400" height="420" fill="url(#bgHaze)" />

  <!-- Faintest ghost ridge, painted into the background so the mountain layer
       always has something soft behind it even at maximum parallax offset -->
  <path
    d="M-400 470 L -120 388 L 90 424 L 320 356 L 540 404 L 790 330 L 1010 380 L 1250 312 L 1460 366 L 1700 320 L 2000 378 L 2000 760 L -400 760 Z"
    fill="#cfe3e6"
    opacity="0.55"
  />
  <path
    d="M-400 560 L -80 496 L 210 536 L 470 478 L 720 520 L 980 462 L 1240 512 L 1520 466 L 1800 508 L 2000 486 L 2000 820 L -400 820 Z"
    fill="#c4d8d2"
    opacity="0.45"
  />

  <!-- Warm ground haze under everything -->
  <rect x="-400" y="700" width="2400" height="700" fill="#e0cdaa" opacity="0.45" />
</svg>
