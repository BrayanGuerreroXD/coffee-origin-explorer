<?xml version="1.0" encoding="UTF-8"?>
<!--
  mountains-reference.svg
  TEMPORARY PLACEHOLDER ARTWORK. Original illustration drawn for
  coffee-origin-explorer while the real photographs of the farm do not exist.
  Replace with real farm artwork or photography.

  Layer: MountainLayer (parallax 0.20). TRANSPARENT background on purpose:
  this composites over farm-background-reference.svg.
  Three ridges, each one warmer, darker and more contrasted than the one
  behind it. Content overscans the viewBox on every side.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="mtFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2d6d6" />
      <stop offset="0.55" stop-color="#b2c8c6" />
      <stop offset="1" stop-color="#c8dad6" />
    </linearGradient>
    <linearGradient id="mtMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ab7a2" />
      <stop offset="0.5" stop-color="#84a68d" />
      <stop offset="1" stop-color="#9dbaa3" />
    </linearGradient>
    <linearGradient id="mtNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d9463" />
      <stop offset="0.45" stop-color="#4c7a45" />
      <stop offset="1" stop-color="#3d6a3c" />
    </linearGradient>
    <linearGradient id="mtNearShade" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2f5733" stop-opacity="0.55" />
      <stop offset="1" stop-color="#2f5733" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mtValleyMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e6d2" stop-opacity="0" />
      <stop offset="1" stop-color="#f2e6d2" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- ============ FAR RIDGE — palest, coolest, lowest contrast ============ -->
  <g>
    <path
      d="M-400 320
         L -140 236 L 60 282 L 268 196 L 430 258 L 620 168 L 812 224
         L 1010 152 L 1186 214 L 1392 146 L 1560 206 L 1760 158 L 2000 226
         L 2000 700 L -400 700 Z"
      fill="url(#mtFar)"
    />
    <!-- lit faces, barely separated in value -->
    <g fill="#d3e2df" opacity="0.7">
      <path d="M268 196 L 430 258 L 350 300 L 200 260 Z" />
      <path d="M620 168 L 812 224 L 720 272 L 552 224 Z" />
      <path d="M1010 152 L 1186 214 L 1094 258 L 946 208 Z" />
      <path d="M1392 146 L 1560 206 L 1470 250 L 1320 202 Z" />
      <path d="M-140 236 L 60 282 L -20 322 L -190 276 Z" />
      <path d="M1760 158 L 2000 226 L 1900 268 L 1700 212 Z" />
    </g>
    <!-- shadowed faces -->
    <g fill="#a6bfbf" opacity="0.55">
      <path d="M268 196 L 200 260 L 128 300 L 60 282 Z" />
      <path d="M620 168 L 552 224 L 470 286 L 430 258 Z" />
      <path d="M1010 152 L 946 208 L 866 268 L 812 224 Z" />
      <path d="M1392 146 L 1320 202 L 1238 262 L 1186 214 Z" />
    </g>
  </g>

  <!-- ============ MID RIDGE ============ -->
  <g>
    <path
      d="M-400 452
         L -170 372 L 30 414 L 226 330 L 404 388 L 596 312 L 784 368
         L 968 300 L 1150 360 L 1330 288 L 1508 348 L 1706 300 L 2000 366
         L 2000 780 L -400 780 Z"
      fill="url(#mtMid)"
    />
    <g fill="#aec8b3" opacity="0.65">
      <path d="M226 330 L 404 388 L 318 432 L 160 384 Z" />
      <path d="M596 312 L 784 368 L 700 414 L 534 366 Z" />
      <path d="M968 300 L 1150 360 L 1064 404 L 906 354 Z" />
      <path d="M1330 288 L 1508 348 L 1424 392 L 1268 342 Z" />
      <path d="M-170 372 L 30 414 L -50 456 L -220 412 Z" />
    </g>
    <g fill="#6d8f78" opacity="0.5">
      <path d="M226 330 L 160 384 L 86 438 L 30 414 Z" />
      <path d="M596 312 L 534 366 L 456 424 L 404 388 Z" />
      <path d="M968 300 L 906 354 L 828 412 L 784 368 Z" />
      <path d="M1330 288 L 1268 342 L 1190 400 L 1150 360 Z" />
      <path d="M1706 300 L 1648 354 L 1572 408 L 1508 348 Z" />
    </g>
    <!-- sketchy ridge hatching, very light -->
    <g stroke="#6d8f78" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M236 344 L 268 412" />
      <path d="M606 326 L 640 396" />
      <path d="M978 314 L 1010 384" />
      <path d="M1340 302 L 1372 372" />
      <path d="M40 428 L 68 486" />
      <path d="M1716 314 L 1748 380" />
    </g>
  </g>

  <!-- valley mist between mid and near ridge -->
  <rect x="-400" y="360" width="2400" height="190" fill="url(#mtValleyMist)" opacity="0.8" />

  <!-- ============ NEAR RIDGE — warmest, darkest, most contrast ============ -->
  <g>
    <path
      d="M-400 586
         L -160 512 L 70 556 L 300 472 L 520 528 L 760 452 L 1000 512
         L 1230 448 L 1440 508 L 1660 456 L 2000 520
         L 2000 900 L -400 900 Z"
      fill="url(#mtNear)"
    />
    <path
      d="M-400 586 L -160 512 L 70 556 L 300 472 L 520 528 L 760 452 L 1000 512 L 1230 448 L 1440 508 L 1660 456 L 2000 520 L 2000 900 L -400 900 Z"
      fill="url(#mtNearShade)"
    />
    <!-- sunlit crests -->
    <g fill="#7da362" opacity="0.72">
      <path d="M300 472 L 520 528 L 430 566 L 236 514 Z" />
      <path d="M760 452 L 1000 512 L 908 550 L 700 496 Z" />
      <path d="M1230 448 L 1440 508 L 1352 546 L 1170 492 Z" />
      <path d="M-160 512 L 70 556 L -20 596 L -220 552 Z" />
      <path d="M1660 456 L 2000 520 L 1920 560 L 1600 498 Z" />
    </g>
    <!-- shadow gullies -->
    <g fill="#2f5733" opacity="0.55">
      <path d="M300 472 L 236 514 L 178 592 L 120 620 L 70 556 Z" />
      <path d="M760 452 L 700 496 L 640 580 L 580 612 L 520 528 Z" />
      <path d="M1230 448 L 1170 492 L 1106 578 L 1050 608 L 1000 512 Z" />
      <path d="M1660 456 L 1600 498 L 1540 578 L 1486 606 L 1440 508 Z" />
    </g>
    <!-- treeline scallops along the crest, small and rhythmic -->
    <g fill="#2f5733" opacity="0.6">
      <path d="M-400 592 q 24 -22 48 0 q 24 -24 48 0 q 24 -20 48 0 q 24 -24 48 0 q 24 -20 48 0 q 24 -22 48 0 l 0 40 l -336 0 Z" transform="translate(0,-8)" />
      <path d="M820 476 q 22 -20 44 0 q 22 -22 44 0 q 22 -18 44 0 q 22 -22 44 0 l 0 44 l -176 0 Z" />
      <path d="M1250 460 q 22 -20 44 0 q 22 -22 44 0 q 22 -18 44 0 l 0 44 l -132 0 Z" />
      <path d="M330 486 q 22 -20 44 0 q 22 -22 44 0 q 22 -18 44 0 q 22 -22 44 0 l 0 44 l -176 0 Z" />
      <path d="M1690 470 q 22 -20 44 0 q 22 -22 44 0 q 22 -18 44 0 q 22 -22 44 0 l 0 44 l -176 0 Z" />
    </g>
    <!-- contour scratches suggesting planted terraces on the near ridge -->
    <g stroke="#2f5733" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-380 640 C -120 600, 120 626, 340 592" />
      <path d="M560 604 C 760 560, 960 588, 1150 552" />
      <path d="M1250 576 C 1420 548, 1600 570, 1980 544" />
      <path d="M-380 700 C -100 664, 180 690, 420 656" />
      <path d="M620 668 C 830 628, 1030 656, 1230 620" />
    </g>
  </g>

  <!-- soft base fade so the ridge dissolves into the ground layer -->
  <rect x="-400" y="700" width="2400" height="260" fill="#4c7a45" opacity="0.18" />
</svg>
